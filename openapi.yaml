  /api/v1/authors/me/dashboard/:
    get:
      operationId: api_v1_authors_me_dashboard_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
          description: ''
  /api/v1/health/:
    get:
      operationId: api_v1_health_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/tickets/:
    get:
      operationId: api_v1_tickets_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuthorTicketList'
          description: ''
    post:
      operationId: api_v1_tickets_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TicketCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TicketCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCreate'
          description: ''
  /api/v1/tickets/{id}/:
    get:
      operationId: api_v1_tickets_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorTicket'
          description: ''
  /api/v1/tickets/{id}/ai/classify/:
    post:
      operationId: api_v1_tickets_ai_classify_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTicket'
          description: ''
  /api/v1/tickets/{id}/messages/:
    get:
      operationId: api_v1_tickets_messages_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
    post:
      operationId: api_v1_tickets_messages_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Message'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Message'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
components:
  schemas:
    AdminTicket:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ticket_number:
          type: string
          readOnly: true
        book:
          type: integer
          nullable: true
        book_data:
          allOf:
          - $ref: '#/components/schemas/Book'
          readOnly: true
        subject:
          type: string
          maxLength: 180
        description:
          type: string
          maxLength: 5000
        category:
          $ref: '#/components/schemas/CategoryEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        status:
          $ref: '#/components/schemas/StatusEnum'
        ai_status:
          type: string
          maxLength: 20
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        author_name:
          type: string
          readOnly: true
        author_email:
          type: string
          readOnly: true
        assigned_admin:
          type: integer
          nullable: true
        assigned_admin_name:
          type: string
          readOnly: true
        category_source:
          type: string
          maxLength: 12
        priority_source:
          type: string
          maxLength: 12
        ai_confidence:
          type: number
          format: double
          nullable: true
        ai_reason:
          type: string
          maxLength: 300
        ai_draft:
          type: string
        ai_model:
          type: string
          maxLength: 100
        ai_error:
          type: string
          maxLength: 250
        ai_processed_at:
          type: string
          format: date-time
          nullable: true
        ai_latency_ms:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        ai_input_tokens:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        ai_output_tokens:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          readOnly: true
        notes:
          type: array
          items:
            $ref: '#/components/schemas/Note'
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true
      required:
      - assigned_admin_name
      - author_email
      - author_name
      - book_data
      - created_at
      - description
      - id
      - messages
      - notes
      - subject
      - ticket_number
      - updated_at
    AuthorTicket:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ticket_number:
          type: string
          readOnly: true
        book:
          type: integer
          nullable: true
        book_data:
          allOf:
          - $ref: '#/components/schemas/Book'
          readOnly: true
        subject:
          type: string
          maxLength: 180
        description:
          type: string
          maxLength: 5000
        category:
          $ref: '#/components/schemas/CategoryEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        status:
          $ref: '#/components/schemas/StatusEnum'
        ai_status:
          type: string
          maxLength: 20
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - book_data
      - created_at
      - description
      - id
      - subject
      - ticket_number
      - updated_at
    Book:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        book_id:
          type: string
          maxLength: 64
        title:
          type: string
          maxLength: 300
        isbn:
          type: string
          nullable: true
          maxLength: 64
        genre:
          type: string
          maxLength: 100
        publication_date:
          type: string
          format: date
          nullable: true
        status:
          type: string
          maxLength: 100
        mrp:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        author_royalty_per_copy:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        total_copies_sold:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        total_royalty_earned:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        royalty_paid:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        royalty_pending:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        last_royalty_payout_date:
          type: string
          format: date
          nullable: true
        print_partner:
          type: string
          nullable: true
          maxLength: 200
        available_on: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        author:
          type: integer
          readOnly: true
      required:
      - author
      - book_id
      - created_at
      - id
      - status
      - title
      - updated_at
    CategoryEnum:
      enum:
      - ROYALTY
      - ISBN
      - PRINTING
      - DISTRIBUTION
      - PRODUCTION
      - GENERAL
      type: string
      description: |-
        * `ROYALTY` - Royalty & Payments
        * `ISBN` - ISBN & Metadata Issues
        * `PRINTING` - Printing & Quality
        * `DISTRIBUTION` - Distribution & Availability
        * `PRODUCTION` - Book Status & Production Updates
        * `GENERAL` - General Inquiry
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Login:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Logout:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
      required:
      - refresh
    Message:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        sender_name:
          type: string
          readOnly: true
        sender_role:
          type: string
          readOnly: true
        message:
          type: string
          maxLength: 5000
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - message
      - sender_name
      - sender_role
    Note:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        admin_name:
          type: string
          readOnly: true
        note:
          type: string
          maxLength: 4000
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - admin_name
      - created_at
      - id
      - note
    PaginatedAdminTicketList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminTicket'
    PaginatedAuthorTicketList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuthorTicket'
    PaginatedBookList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Book'
    PatchedAdminTicketUpdate:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/CategoryEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        status:
          $ref: '#/components/schemas/StatusEnum'
        assigned_admin:
          type: integer
          nullable: true
    PriorityEnum:
      enum:
      - CRITICAL
      - HIGH
      - MEDIUM
      - LOW
      type: string
      description: |-
        * `CRITICAL` - Critical
        * `HIGH` - High
        * `MEDIUM` - Medium
        * `LOW` - Low
    Profile:
      type: object
      properties:
        author_id:
          type: string
          maxLength: 64
        phone:
          type: string
          maxLength: 40
        city:
          type: string
          maxLength: 100
        joined_date:
          type: string
          format: date
          nullable: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
      required:
      - author_id
      - user
    RoleEnum:
      enum:
      - AUTHOR
      - ADMIN
      type: string
      description: |-
        * `AUTHOR` - Author
        * `ADMIN` - Admin
    StatusEnum:
      enum:
      - OPEN
      - IN_PROGRESS
      - RESOLVED
      - CLOSED
      type: string
      description: |-
        * `OPEN` - Open
        * `IN_PROGRESS` - In Progress
        * `RESOLVED` - Resolved
        * `CLOSED` - Closed
    TicketCreate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ticket_number:
          type: string
          readOnly: true
        book:
          type: integer
          nullable: true
        subject:
          type: string
          maxLength: 180
        description:
          type: string
          maxLength: 5000
      required:
      - description
      - id
      - subject
      - ticket_number
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        full_name:
          type: string
          maxLength: 160
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - email
      - full_name
      - id
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
