      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookList'
          description: ''
  /api/v1/authors/me/books/{id}/:
    get:
      operationId: author_book_retrieve
      parameters:
      - in: path
        name: id
